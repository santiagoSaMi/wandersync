# =====================================================================
#  WanderSync - un solo comando:   docker compose up --build
#  Requiere un .env (python3 scripts/init_env.py) con las 3 variables de Supabase.
#
#  Redes:  edge    -> frontend + gateway (unicas con puertos publicados de la app)
#          backend -> INTERNA (sin salida a internet): microservicios, Postgres, Redis
#          data    -> ingesta: mock-source, Prefect, Dask (necesita salida a Supabase)
#  Todos los puertos se publican solo en 127.0.0.1.
# =====================================================================
name: wandersync

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

# Una sola imagen para Prefect server + scheduler Dask + workers Dask + runner del flow:
# garantiza las mismas versiones de Python/dask/distributed en todo el cluster.
x-ingestion: &ingestion
  <<: *hardening
  build:
    context: ./services/ingestion
  image: wandersync/ingestion:local

x-ingestion-env: &ingestion-env
  PREFECT_API_URL: http://prefect-server:4200/api
  PREFECT_LOGGING_LEVEL: INFO
  SUPABASE_URL: ${SUPABASE_URL:?Falta SUPABASE_URL en .env (ver README, paso 1)}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?Falta SUPABASE_SERVICE_KEY en .env (ver README, paso 1)}
  MOCK_SOURCE_URL: http://mock-source:8090
  DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:8786
  INGEST_CRON: "${INGEST_CRON:-*/30 * * * *}"
  INGEST_DATE_OFFSETS: ${INGEST_DATE_OFFSETS:-7,14,21,28}
  INGEST_STAY_NIGHTS: ${INGEST_STAY_NIGHTS:-3}

services:
  # ------------------------------------------------------------------ infraestructura
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta python3 scripts/init_env.py}
      FLIGHTS_DB_PASSWORD: ${FLIGHTS_DB_PASSWORD:?Ejecuta python3 scripts/init_env.py}
      HOTELS_DB_PASSWORD: ${HOTELS_DB_PASSWORD:?Ejecuta python3 scripts/init_env.py}
      CARS_DB_PASSWORD: ${CARS_DB_PASSWORD:?Ejecuta python3 scripts/init_env.py}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Ejecuta python3 scripts/init_env.py}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Ejecuta python3 scripts/init_env.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Ejecuta python3 scripts/init_env.py}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # ------------------------------------------------------------------ microservicios de dominio (SAGA)
  flights:
    <<: *hardening
    build: ./services/flights
    environment:
      DATABASE_URL: postgresql+asyncpg://flights_svc:${FLIGHTS_DB_PASSWORD}@postgres:5432/flights_db
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Ejecuta python3 scripts/init_env.py}
      ALLOW_FAILURE_SIMULATION: ${ALLOW_FAILURE_SIMULATION:-false}
      FAIL_RATE: "0"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    networks: [backend]

  hotels:
    <<: *hardening
    build: ./services/hotels
    environment:
      DATABASE_URL: postgresql+asyncpg://hotels_svc:${HOTELS_DB_PASSWORD}@postgres:5432/hotels_db
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ALLOW_FAILURE_SIMULATION: ${ALLOW_FAILURE_SIMULATION:-false}
      FAIL_RATE: "0"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    networks: [backend]

  cars:
    <<: *hardening
    build: ./services/cars
    environment:
      DATABASE_URL: postgresql+asyncpg://cars_svc:${CARS_DB_PASSWORD}@postgres:5432/cars_db
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ALLOW_FAILURE_SIMULATION: ${ALLOW_FAILURE_SIMULATION:-false}
      FAIL_RATE: "0"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    networks: [backend]

  orders:
    <<: *hardening
    build: ./services/orders
    environment:
      DATABASE_URL: postgresql+asyncpg://orders_svc:${ORDERS_DB_PASSWORD}@postgres:5432/orders_db
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      FLIGHTS_URL: http://flights:8000
      HOTELS_URL: http://hotels:8000
      CARS_URL: http://cars:8000
      # Observabilidad: cada SAGA aparece en Prefect (UI :4200) como flow run con flechas entre pasos
      PREFECT_API_URL: http://prefect-server:4200/api
      ALLOW_FAILURE_SIMULATION: ${ALLOW_FAILURE_SIMULATION:-false}
    depends_on:
      postgres: { condition: service_healthy }
      flights: { condition: service_healthy }
      hotels: { condition: service_healthy }
      cars: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    networks: [backend]

  auth:
    <<: *hardening
    build: ./services/auth
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_svc:${AUTH_DB_PASSWORD}@postgres:5432/auth_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    networks: [backend]

  # ------------------------------------------------------------------ API Gateway GraphQL + frontend
  gateway:
    <<: *hardening
    build: ./services/gateway
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Falta SUPABASE_URL en .env (ver README, paso 1)}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Falta SUPABASE_ANON_KEY en .env (ver README, paso 1)}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      AUTH_URL: http://auth:8000
      ORDERS_URL: http://orders:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GRAPHIQL: ${GRAPHIQL:-false}
      ALLOW_FAILURE_SIMULATION: ${ALLOW_FAILURE_SIMULATION:-false}
      # X-Real-IP solo se cree si la peticion viene del nginx (contenedor "frontend", resuelto por DNS).
      # Las peticiones directas al puerto 8000 se limitan por su IP real aunque falsifiquen la cabecera.
      TRUSTED_PROXY_HOSTS: frontend
      # Pausa por paso de la SAGA en el modo presentacion ("paso a paso" del checkout; solo modo demo)
      DEMO_STEP_DELAY_MS: ${DEMO_STEP_DELAY_MS:-2500}
    depends_on:
      auth: { condition: service_healthy }
      orders: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    networks: [edge, backend]

  frontend:
    <<: *hardening
    build: ./frontend
    depends_on:
      gateway: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [edge]

  # ------------------------------------------------------------------ ingesta: scraping distribuido
  mock-source:
    <<: *hardening
    build: ./services/mock-source
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.10}
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 15
    networks: [data]

  prefect-server:
    <<: *ingestion
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_UI_API_URL: http://localhost:4200/api      # la UI corre en TU navegador
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      # Prefect copia la UI a un directorio escribible al arrancar; por defecto usa site-packages, que el
      # usuario no-root no puede escribir (=> solo API, la UI responde 404). Se usa el volumen de Prefect.
      PREFECT_SERVER_UI_STATIC_DIRECTORY: /home/app/.prefect/ui
    volumes:
      - prefect-data:/home/app/.prefect
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4200/api/health', timeout=3)"]
      interval: 8s
      timeout: 5s
      retries: 30
    # backend: el servicio orders refleja cada SAGA en Prefect (flow run por reserva). backend sigue siendo
    # interna (sin salida a internet); Prefect solo es alcanzable desde los contenedores, no desde fuera.
    networks: [data, backend]

  dask-scheduler:
    <<: *ingestion
    command: ["dask", "scheduler", "--port", "8786", "--dashboard-address", ":8787"]
    ports:
      - "127.0.0.1:8787:8787"       # dashboard de Dask
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8786), 3)"]
      interval: 8s
      timeout: 5s
      retries: 20
    networks: [data]

  dask-worker:
    <<: *ingestion
    command: ["dask", "worker", "tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "1GB"]
    environment: *ingestion-env
    depends_on:
      dask-scheduler: { condition: service_healthy }
      prefect-server: { condition: service_healthy }
    deploy:
      replicas: 3                    # 3 workers x 2 hilos = 6 tareas en paralelo
    networks: [data]

  ingestion:
    <<: *ingestion
    command: ["python", "-m", "ingestion.serve"]
    environment: *ingestion-env
    depends_on:
      prefect-server: { condition: service_healthy }
      dask-scheduler: { condition: service_healthy }
      dask-worker: { condition: service_started }
      mock-source: { condition: service_healthy }
    networks: [data]

networks:
  edge: {}
  backend:
    internal: true                   # sin salida a internet
  data: {}

volumes:
  postgres-data:
  prefect-data:
